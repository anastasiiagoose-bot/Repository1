<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Результат обчислення</title>
</head>
<body>
    <h2>Вітаємо, {{ username }}!</h2>
    <p>Ви скористалися нашим сервісом для обчислення довжини рядка.</p>
    <p><b>Переданий рядок (після очищення пробілів):</b> "{{ cleaned_string }}"</p>
    <p><b>Довжина цього рядка складає:</b> {{ string_length }} символів.</p>
    <br>
    <p>З повагою, автоматична система сповіщень.</p>
</body>
</html>
